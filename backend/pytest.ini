[pytest]
DJANGO_SETTINGS_MODULE = secapp.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --cov=. --cov-report=html --cov-report=term-missing --strict-markers
testpaths = .
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests