services:
  db:
    image: postgres:16
    container_name: secapp-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secapp_db
    volumes:
      - postgres_secapp_data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
        sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py cleanup_old_notifications && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/staticfiles:/app/staticfiles
    ports:
      - "8888:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy # Attend que le healthcheck passe

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3333:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  postgres_secapp_data:
