version: '3.9'

services:
  # PostgreSQL Database
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: secapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-secapp}
      POSTGRES_USER: ${DB_USER:-secapp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secapp_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - secapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secapp_user} -d ${DB_NAME:-secapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secapp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Django settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-please-change-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}

      # Database settings
      DB_NAME: ${DB_NAME:-secapp}
      DB_USER: ${DB_USER:-secapp_user}
      DB_PASSWORD: ${DB_PASSWORD:-secapp_password}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}

      # CORS settings
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000}

      # Azure OpenAI (for future phases)
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}

      # Resend Email (for future phases)
      RESEND_API_KEY: ${RESEND_API_KEY:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - secapp-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/healthz/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secapp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - secapp-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  secapp-network:
    driver: bridge
    name: secapp-network

volumes:
  postgres_data:
    name: secapp-postgres-data
  backend_static:
    name: secapp-backend-static
  backend_media:
    name: secapp-backend-media