services:
  db:
    image: postgres:16
    container_name: guardianiq-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-guardianiq_db}
    volumes:
      - postgres_guardianiq_data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-guardianiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardianiq-network

  backend:
    image: rayandans/guardianiq:backend-latest
    container_name: guardianiq-backend-prod
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py cleanup_old_notifications &&
             gunicorn secapp.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8888:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - guardianiq-network

  frontend:
    image: rayandans/guardianiq:frontend-latest
    container_name: guardianiq-frontend-prod
    restart: always
    ports:
      - "3333:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - guardianiq-network

volumes:
  postgres_guardianiq_data:
  backend_static:
  backend_media:

networks:
  guardianiq-network:
    driver: bridge
